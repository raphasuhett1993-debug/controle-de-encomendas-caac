<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Funcionários</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body { overflow:hidden; background:#f4f6f9; }

    .topbar {
      height:56px;
      background:#031d42;
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 20px;
      font-weight:bold;
    }

    .sidebar {
      width:220px;
      background:#212529;
      height:calc(100vh - 56px);
      position:fixed;
      top:56px;
      left:0;
      padding-top:15px;
    }

    .sidebar a {
      color:#adb5bd;
      padding:12px 20px;
      display:block;
      text-decoration:none;
    }

    .sidebar a:hover,
    .sidebar a.active {
      background:#343a40;
      color:#fff;
    }

    .content {
      margin-left:220px;
      margin-top:56px;
      height:calc(100vh - 56px);
      padding:20px;
    }

    .scroll-area {
      max-height:60vh;
      overflow-y:auto;
    }

    .card {
      box-shadow:0 4px 10px rgba(0,0,0,0.05);
    }
  </style>
</head>
<body>

<!-- TOPO -->
<div class="topbar">
  <span>Sistema de Registro e Retirada de Encomendas</span>
  <div class="d-flex gap-3 align-items-center">
    <span id="usuarioLogado" class="fw-normal"></span>
    <button class="btn btn-sm btn-light" onclick="logout()">Sair</button>
  </div>
</div>

<!-- MENU -->
<div class="sidebar">
  <a href="dashboard.html">📊 Dashboard</a>
  <a href="index.html">📦 Registro e Retirada</a>
  <a href="armazenadas.html">🏷️ Encomendas Armazenadas</a>
  <a href="retiradas.html">✅ Encomendas Retiradas</a>
  <a href="moradores.html" data-perfil="admin">👥 Cadastro de Moradores</a>
  <a href="relatorios.html" data-perfil="admin">📈 Relatórios</a>
  <a href="funcionarios.html" class="active" data-perfil="admin">🧑‍💼 Funcionários</a>
  <a href="auditoria.html" data-perfil="admin">🕵️ Auditoria</a>
</div>

<!-- CONTEÚDO -->
<div class="content">
  <div class="row g-4">

    <!-- CADASTRO -->
    <div class="col-md-4">
      <div class="card">
        <div class="card-header fw-bold">Cadastrar Funcionário</div>
        <div class="card-body">

          <form id="form-funcionario">
            <div class="mb-2">
              <label>Nome</label>
              <input id="nome" class="form-control" required>
            </div>

            <div class="mb-2">
              <label>Email (login)</label>
              <input id="email" type="email" class="form-control" required>
            </div>

            <div class="mb-2">
              <label>Senha inicial</label>
              <input id="senha" type="password" class="form-control" required>
            </div>

            <div class="mb-3">
              <label>Perfil</label>
              <select id="perfil" class="form-select" required>
                <option value="">Selecione</option>
                <option value="admin">Administrador</option>
                <option value="supervisor">Supervisor</option>
                <option value="portaria">Portaria</option>
              </select>
            </div>

            <button class="btn btn-success w-100">Cadastrar</button>
          </form>

          <div id="mensagem" class="mt-3 fw-bold"></div>
        </div>
      </div>
    </div>

    <!-- LISTA -->
    <div class="col-md-8">
      <div class="card">
        <div class="card-header fw-bold">Funcionários Cadastrados</div>

        <div class="scroll-area">
          <table class="table table-striped mb-0">
            <thead class="table-light">
              <tr>
                <th>Nome</th>
                <th>Perfil</th>
                <th>Status</th>
                <th style="width:90px"></th>
                <th style="width:90px"></th>
              </tr>
            </thead>
            <tbody id="tabela-funcionarios"></tbody>
          </table>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- MODAL EXCLUIR / ATIVAR -->
<div class="modal fade" id="modalExcluirFuncionario">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5>Confirmar Ação</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <p id="textoExcluirFuncionario"></p>
        <input type="hidden" id="excluirFuncionarioId">
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button class="btn btn-success" onclick="ativarFuncionario()">Ativar</button>
        <button class="btn btn-danger" onclick="confirmarExcluirFuncionario()">Desativar</button>
      </div>
    </div>
  </div>
</div>

<!-- MODAL EDITAR -->
<div class="modal fade" id="modalEditarFuncionario">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5>Editar Funcionário</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">

        <input type="hidden" id="editarFuncionarioId">

        <label>Nome</label>
        <input id="editarFuncionarioNome" class="form-control mb-2">

        <label>Perfil</label>
        <select id="editarFuncionarioPerfil" class="form-select">
          <option value="admin">Admin</option>
          <option value="supervisor">Supervisor</option>
          <option value="portaria">Portaria</option>
        </select>

      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button class="btn btn-success" onclick="salvarEdicaoFuncionario()">Salvar</button>
      </div>
    </div>
  </div>
</div>

<!-- SCRIPTS PADRÃO -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
<script src="js/permissoes.js"></script>

<script>
const form = document.getElementById('form-funcionario');
const tabela = document.getElementById('tabela-funcionarios');
const msg = document.getElementById('mensagem');

const modalEditarFuncionario = new bootstrap.Modal(
  document.getElementById('modalEditarFuncionario')
);
const modalExcluirFuncionario = new bootstrap.Modal(
  document.getElementById('modalExcluirFuncionario')
);

/* CADASTRO */
form.onsubmit = async e => {
  e.preventDefault();
  msg.innerText = 'Processando...';

  const payload = {
    nome: nome.value,
    email: email.value,
    senha: senha.value,
    perfil: perfil.value
  };

  const resp = await fetch('/admin/criar-funcionario', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  });

  const json = await resp.json();

  if (!resp.ok) {
    msg.innerText = json.erro || 'Erro ao criar funcionário';
    msg.className = 'text-danger';
    return;
  }

  msg.innerText = 'Funcionário cadastrado com sucesso';
  msg.className = 'text-success';
  form.reset();
  carregarFuncionarios();
};

/* LISTAGEM */
async function carregarFuncionarios() {
  const { data, error } = await supabaseClient
    .from('funcionarios')
    .select('id, nome, perfil, ativo')
    .order('nome');

  if (error) return console.error(error);

  tabela.innerHTML = '';

  data.forEach(f => {
    tabela.innerHTML += `
      <tr>
        <td>${f.nome}</td>
        <td>${f.perfil}</td>
        <td>
          <span class="badge ${f.ativo ? 'bg-success' : 'bg-secondary'}">
            ${f.ativo ? 'Ativo' : 'Inativo'}
          </span>
        </td>
        <td>
          <button class="btn btn-sm btn-outline-primary"
            onclick="abrirEditarFuncionario('${f.id}')">Editar</button>
        </td>
        <td>
          <button class="btn btn-sm btn-outline-danger"
            onclick="abrirExcluirFuncionario('${f.id}','${f.nome}',${f.ativo})">
            ${f.ativo ? 'Desativar' : 'Ativar'}
          </button>
        </td>
      </tr>`;
  });
}

/* EXCLUIR / ATIVAR */
function abrirExcluirFuncionario(id, nome, ativo) {
  excluirFuncionarioId.value = id;
  textoExcluirFuncionario.innerText = ativo
    ? `Deseja desativar o funcionário ${nome}?`
    : `Deseja ativar o funcionário ${nome}?`;
  modalExcluirFuncionario.show();
}

async function confirmarExcluirFuncionario() {
  await supabaseClient.from('funcionarios')
    .update({ ativo: false })
    .eq('id', excluirFuncionarioId.value);

  modalExcluirFuncionario.hide();
  carregarFuncionarios();
}

async function ativarFuncionario() {
  await supabaseClient.from('funcionarios')
    .update({ ativo: true })
    .eq('id', excluirFuncionarioId.value);

  modalExcluirFuncionario.hide();
  carregarFuncionarios();
}

/* EDITAR */
async function abrirEditarFuncionario(id) {
  const { data } = await supabaseClient
    .from('funcionarios')
    .select('id, nome, perfil')
    .eq('id', id)
    .single();

  editarFuncionarioId.value = data.id;
  editarFuncionarioNome.value = data.nome;
  editarFuncionarioPerfil.value = data.perfil;

  modalEditarFuncionario.show();
}

async function salvarEdicaoFuncionario() {
  await supabaseClient.from('funcionarios')
    .update({
      nome: editarFuncionarioNome.value,
      perfil: editarFuncionarioPerfil.value
    })
    .eq('id', editarFuncionarioId.value);

  modalEditarFuncionario.hide();
  carregarFuncionarios();
}

carregarFuncionarios();
</script>

</body>
</html>
