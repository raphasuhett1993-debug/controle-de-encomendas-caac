<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Relatórios</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      overflow: hidden;
      background-color: #f4f6f9;
    }

    .topbar {
      height: 56px;
      background-color: #031d42;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      font-weight: bold;
    }

    .sidebar {
      width: 220px;
      background-color: #212529;
      height: calc(100vh - 56px);
      position: fixed;
      top: 56px;
      left: 0;
      padding-top: 15px;
    }

    .sidebar a {
      color: #adb5bd;
      padding: 12px 20px;
      display: block;
      text-decoration: none;
    }

    .sidebar a:hover,
    .sidebar a.active {
      background-color: #343a40;
      color: #fff;
    }

    .content {
      margin-left: 220px;
      margin-top: 56px;
      height: calc(100vh - 56px);
      padding: 20px;
    }

    .card {
      max-width: 600px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }
  </style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <span>Sistema de Registro e Retirada de Encomendas</span>

  <div class="d-flex align-items-center gap-3">
    <span id="usuarioLogado" class="fw-normal"></span>

    <button type="button" class="btn btn-sm btn-light" onclick="logout()">
      Sair
    </button>
  </div>
</div>

<!-- MENU LATERAL -->
<div class="sidebar">
  <a href="dashboard.html">📊 Dashboard</a>
  <a href="index.html">📦 Registro e Retirada</a>
  <a href="armazenadas.html">🏷️ Encomendas Armazenadas</a>
  <a href="retiradas.html">✅ Encomendas Retiradas</a>
  <a href="moradores.html" data-perfil="admin">👥 Cadastro de Moradores</a>
  <a href="relatorios.html" data-perfil="admin"class="active">📈 Relatórios</a>
  <a href="funcionarios.html" data-perfil="admin">🧑‍💼 Funcionários</a>
  <a href="auditoria.html" data-perfil="admin">🕵️ Auditoria</a>

</div>


<!-- CONTEÚDO -->
<div class="content">

  <div class="card">
    <div class="card-header fw-bold">
      Gerar Relatório de Retiradas
    </div>

    <div class="card-body">

      <div class="mb-3">
        <label>Data inicial</label>
        <input type="date" id="dataInicio" class="form-control">
      </div>

      <div class="mb-3">
        <label>Data final</label>
        <input type="date" id="dataFim" class="form-control">
      </div>

      <div class="d-grid gap-2">
        <button class="btn btn-success" onclick="gerarExcel()">
          📗 Gerar Excel
        </button>

        <button class="btn btn-danger" onclick="gerarPDF()">
          📕 Gerar PDF
        </button>
      </div>

      <div id="mensagem" class="mt-3 fw-bold"></div>

    </div>
  </div>

</div>

<!-- SCRIPTS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<script>
/* 🔐 SUPABASE */
const supabaseClient = supabase.createClient(
  'https://evuannfoutiphieqgvii.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV2dWFubmZvdXRpcGhpZXFndmlpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYzMTg2MTgsImV4cCI6MjA4MTg5NDYxOH0.BYDD8vVAoKtzxZfzsn_c1OdgmqsrrPGk9g4yK0QzimE'
);

/* 🔒 PROTEÇÃO + DADOS DO USUÁRIO */
(async () => {
  const { data: { session } } = await supabaseClient.auth.getSession();

  if (!session) {
    window.location.href = 'login.html';
    return;
  }

  const { data: funcionario, error } = await supabaseClient
    .from('funcionarios')
    .select('nome, perfil')
    .eq('id', session.user.id)
    .single();

  if (error || !funcionario) {
    console.error('Erro ao buscar funcionário:', error);
    return;
  }

  document.getElementById('usuarioLogado').innerText =
    `${funcionario.nome} (${funcionario.perfil})`;

  // 👇 A CHAMADA TEM QUE FICAR AQUI, DENTRO DO BLOCO
  aplicarPermissoes(funcionario.perfil);
})();

/* ===============================
   FUNÇÃO DE PERMISSÕES
================================ */
function aplicarPermissoes(perfil) {
  document.querySelectorAll('[data-perfil]').forEach(el => {
    if (el.dataset.perfil !== perfil) {
      el.style.display = 'none';
    }
  });
}


/* 🚪 LOGOUT */
async function logout() {
  await supabaseClient.auth.signOut();
  window.location.href = 'login.html';
}

/* 📗 EXCEL */
function gerarExcel() {
  const inicio = document.getElementById('dataInicio').value;
  const fim = document.getElementById('dataFim').value;
  const msg = document.getElementById('mensagem');

  if (!inicio || !fim) {
    msg.innerText = 'Informe o período';
    msg.className = 'text-danger';
    return;
  }

  window.open(
    `http://localhost:3000/relatorio/retiradas/excel?dataInicio=${inicio}&dataFim=${fim}`,
    '_blank'
  );

  msg.innerText = 'Relatório Excel gerado';
  msg.className = 'text-success';
}

/* 📕 PDF */
function gerarPDF() {
  const inicio = document.getElementById('dataInicio').value;
  const fim = document.getElementById('dataFim').value;
  const msg = document.getElementById('mensagem');

  if (!inicio || !fim) {
    msg.innerText = 'Informe o período';
    msg.className = 'text-danger';
    return;
  }

  window.open(
    `http://localhost:3000/relatorio/retiradas/pdf?dataInicio=${inicio}&dataFim=${fim}`,
    '_blank'
  );

  msg.innerText = 'Relatório PDF gerado';
  msg.className = 'text-success';
}
</script>

</body>
</html>
