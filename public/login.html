<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Login</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <style>
    body {
      background-color: #3d5d8d;
      height: 70vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      width: 380px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .logo {
      max-width: 90px;
      margin-bottom: 10px;
    }

    .condominio-nome {
      font-size: 16px;
      font-weight: 600;
      color: #021127;
      margin-bottom: 50px;
      text-align: center;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="card-body text-center">

    <!-- LOGO -->
    <img
      src="img/logo.png"
      alt="Condomínio Almirante Alves Camara"
      class="logo"
    >

    <!-- NOME DO CONDOMÍNIO -->
    <div class="condominio-nome">
      <div> Condomínio Almirante Alves Camara
      
      <div> Sistema de Controle de Encomendas
      
    </div>

    <!-- FORMULÁRIO -->
    <form id="form-login" class="text-start">

      <div class="mb-3">
        <label>Email</label>
        <input
          type="email"
          id="email"
          class="form-control"
          required
          autocomplete="username"
        >
      </div>

      <div class="mb-3">
        <label>Senha</label>
        <input
          type="password"
          id="senha"
          class="form-control"
          required
          autocomplete="current-password"
        >
      </div>

      <button class="btn btn-primary w-100">
        Entrar
      </button>
    </form>

    <div id="mensagem" class="mt-3 fw-bold text-center"></div>
  </div>
</div>

<!-- SCRIPTS PADRÃO DO PROJETO -->
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>

<script>
const form = document.getElementById('form-login');
const msg  = document.getElementById('mensagem');

form.onsubmit = async e => {
  e.preventDefault();

  msg.innerText = 'Autenticando...';
  msg.className = '';

  const email = document.getElementById('email').value.trim();
  const senha = document.getElementById('senha').value;

  const { error } = await supabaseClient.auth.signInWithPassword({
    email,
    password: senha
  });

  if (error) {
    msg.innerText = 'Email ou senha inválidos';
    msg.className = 'text-danger';
    return;
  }

  window.location.href = 'index.html';
};
</script>

</body>
</html>
